name: SportyCute
options:
  bundleIdPrefix: indie.sportycute
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
schemes:
  SportyCute:
    build:
      targets:
        SportyCute: all
    test:
      gatherCoverageData: true
      targets:
        - SportyCuteTests
        - SportyCuteUITests
targets:
  SportyCute:
    type: application
    platform: iOS
    sources:
      - SportyCute
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: indie.sportycute.app
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: sporty-cute
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Record a cheer to play at a race checkpoint.
        NSLocationWhenInUseUsageDescription: Use your location during a race to play cheers at the right checkpoints.
        NSBluetoothAlwaysUsageDescription: Detect your configured triathlon transition beacons during a race.
        UIBackgroundModes: [audio, location, bluetooth-central]
  SportyCuteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SportyCuteTests]
    dependencies:
      - target: SportyCute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SportyCuteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SportyCuteUITests]
    dependencies:
      - target: SportyCute
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
